[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsentry"
version = "0.3.0"
description = "Security scanner for MCP servers and AI agent skills: prompt injection, tool poisoning, exfiltration, and supply-chain risks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "M. Rizky Pratama" }]
keywords = [
  "mcp",
  "agent-skills",
  "security",
  "prompt-injection",
  "tool-poisoning",
  "supply-chain",
  "scanner",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentsentry = "agentsentry.cli:main"

[project.urls]
Homepage = "https://github.com/rzkyp/agentsentry"
Issues = "https://github.com/rzkyp/agentsentry/issues"

[tool.setuptools]
packages = ["agentsentry"]
